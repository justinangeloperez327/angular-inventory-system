name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

concurrency:
  group: angular-inventory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.15.0

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Commit generated lockfile
        if: github.event_name == 'pull_request' && github.head_ref == 'group-22-reproducible-dependencies'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin group-22-reproducible-dependencies
          git checkout -B group-22-reproducible-dependencies origin/group-22-reproducible-dependencies
          git add package-lock.json

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "build: commit npm lockfile"
          git push origin HEAD:${{ github.head_ref }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Design-system guard
        run: npm run check:design

      - name: Accessibility guard
        run: npm run check:accessibility

      - name: Production guard
        run: npm run check:production

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build:production

      - name: Browser E2E
        run: npm run e2e

      - name: Build Docker image
        run: docker build --tag angular-inventory-system:ci .

      - name: Smoke-test Docker image
        run: |
          docker run --detach \
            --name angular-inventory-system-ci \
            --publish 8080:8080 \
            --env API_UPSTREAM=http://127.0.0.1:3000 \
            angular-inventory-system:ci

          cleanup() {
            docker logs angular-inventory-system-ci || true
            docker rm --force angular-inventory-system-ci || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/healthz; then
              exit 0
            fi
            sleep 1
          done

          exit 1
