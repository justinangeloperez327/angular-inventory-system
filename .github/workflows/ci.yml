name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: angular-inventory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Dependency contract
        run: npm run check:dependencies

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Design-system guard
        run: npm run check:design

      - name: Accessibility guard
        run: npm run check:accessibility

      - name: Production guard
        run: npm run check:production

      - name: Runtime configuration guard
        run: npm run check:runtime

      - name: Observability guard
        run: npm run check:observability

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build:production

      - name: Browser E2E
        run: npm run e2e

      - name: Build Docker image
        run: |
          docker build \
            --build-arg APP_COMMIT_SHA="${GITHUB_SHA}" \
            --build-arg APP_BUILD_ID="${GITHUB_RUN_ID}" \
            --tag angular-inventory-system:ci \
            .

      - name: Verify Docker runtime
        run: |
          docker run --detach \
            --name angular-inventory-system-ci \
            --publish 8080:8080 \
            --env API_UPSTREAM=http://127.0.0.1:3000 \
            angular-inventory-system:ci

          cleanup() {
            docker logs angular-inventory-system-ci || true
            docker rm --force angular-inventory-system-ci || true
          }
          trap cleanup EXIT

          bash scripts/verify-container-runtime.sh
