name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: angular-inventory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.15.0

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Design-system guard
        run: npm run check:design

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build:production

      - name: Build Docker image
        run: docker build --tag angular-inventory-system:ci .

      - name: Smoke-test Docker image
        run: |
          docker run --detach \
            --name angular-inventory-system-ci \
            --publish 8080:8080 \
            --env API_UPSTREAM=http://127.0.0.1:3000 \
            angular-inventory-system:ci

          cleanup() {
            docker logs angular-inventory-system-ci || true
            docker rm --force angular-inventory-system-ci || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/healthz; then
              exit 0
            fi
            sleep 1
          done

          exit 1
