services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: angular-inventory-system:local
    ports:
      - "8080:8080"
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://host.docker.internal:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
