<app-content-container>
  <app-page-header
    title="Reports"
    description="Operational inventory, purchasing, and sales reporting from backend-authoritative data."
  />

  <div class="report-hub">
    @for (category of categories; track category) {
      <section class="report-hub__section">
        <div class="report-hub__heading">
          <h2>{{ category }}</h2>
          <span>{{ reportsFor(category).length }} reports</span>
        </div>

        <div class="report-hub__grid">
          @for (report of reportsFor(category); track report.id) {
            <a class="report-hub__card" [routerLink]="report.id">
              <strong>{{ report.title }}</strong>
              <span>{{ report.description }}</span>
            </a>
          }
        </div>
      </section>
    }
  </div>
</app-content-container>
