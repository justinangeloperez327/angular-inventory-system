<app-content-container>
  @if (loading()) {
    <app-skeleton height="30rem" />
  } @else {
    <app-page-header
      [title]="editing ? 'Edit customer' : 'New customer'"
      description="Maintain customer identity, contact, tax, and address information used by sales orders."
    />

    @if (error()) {
      <div class="mt-4">
        <app-alert variant="danger" title="Customer error">{{ error() }}</app-alert>
      </div>
    }

    <form class="mt-6 max-w-5xl" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <section>
        <div class="mb-3">
          <h2 class="m-0 text-lg font-semibold text-foreground">Customer</h2>
          <p class="mb-0 mt-1 text-xs text-muted-foreground">
            Business identity and tax reference.
          </p>
        </div>
        <div class="grid gap-3 md:grid-cols-3">
          <app-input label="Code" formControlName="code" [error]="fieldError('code')" />
          <app-input class="md:col-span-2" label="Name" formControlName="name" [error]="fieldError('name')" />
          <app-input label="Tax number" formControlName="taxNumber" [error]="fieldError('taxNumber')" />
        </div>
      </section>

      <section class="mt-5 border-t border-border pt-5">
        <div class="mb-3">
          <h2 class="m-0 text-lg font-semibold text-foreground">Contact</h2>
          <p class="mb-0 mt-1 text-xs text-muted-foreground">
            Primary customer contact used for sales communication.
          </p>
        </div>
        <div class="grid gap-3 md:grid-cols-3">
          <app-input label="Contact name" formControlName="contactName" [error]="fieldError('contactName')" />
          <app-input type="email" label="Email" autocomplete="email" formControlName="email" [error]="fieldError('email')" />
          <app-input label="Phone" autocomplete="tel" formControlName="phone" [error]="fieldError('phone')" />
        </div>
      </section>

      <section class="mt-5 border-t border-border pt-5">
        <div class="mb-3">
          <h2 class="m-0 text-lg font-semibold text-foreground">Address</h2>
          <p class="mb-0 mt-1 text-xs text-muted-foreground">
            Billing or primary business address.
          </p>
        </div>
        <div class="grid gap-3 md:grid-cols-3">
          <app-input class="md:col-span-3" label="Address line 1" formControlName="addressLine1" [error]="fieldError('addressLine1')" />
          <app-input class="md:col-span-3" label="Address line 2" formControlName="addressLine2" [error]="fieldError('addressLine2')" />
          <app-input label="City" formControlName="city" [error]="fieldError('city')" />
          <app-input label="State / Province" formControlName="stateProvince" [error]="fieldError('stateProvince')" />
          <app-input label="Postal code" formControlName="postalCode" [error]="fieldError('postalCode')" />
          <app-input
            label="Country code"
            placeholder="AE"
            hint="ISO 3166-1 alpha-2"
            formControlName="countryCode"
            [error]="fieldError('countryCode')"
          />
        </div>
      </section>

      <div class="mt-5 flex items-center justify-end gap-3 border-t border-border pt-4">
        <a
          [routerLink]="id ? ['/customers', id] : ['/customers']"
          class="text-base font-medium text-muted-foreground no-underline hover:text-foreground"
        >
          Cancel
        </a>
        <app-button type="submit" [loading]="saving()">Save customer</app-button>
      </div>
    </form>
  }
</app-content-container>
