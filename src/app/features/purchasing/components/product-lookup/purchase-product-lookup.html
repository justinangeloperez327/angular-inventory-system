<div class="grid gap-1.5">
  <span class="text-xs font-medium text-muted-foreground">Add product</span>

  <div class="grid items-end gap-2 sm:grid-cols-[minmax(0,1fr)_auto]">
    <app-input type="search" placeholder="Search SKU or product name" [formControl]="search" (keyup.enter)="find()" />
    <app-button type="button" variant="secondary" [loading]="loading()" (click)="find()">Search</app-button>
  </div>

  @if (error()) {
    <span class="text-xs text-danger">{{ error() }}</span>
  }

  @if (results().length > 0) {
    <div class="max-h-64 overflow-auto rounded-sm border border-border bg-surface shadow-md">
      @for (item of results(); track item.id) {
        <button
          type="button"
          class="grid w-full gap-1 border-0 border-b border-border bg-transparent px-3 py-2.5 text-left text-foreground transition-colors last:border-b-0 hover:bg-primary/5 sm:grid-cols-[7rem_minmax(0,1fr)_auto] sm:items-center sm:gap-3"
          (click)="choose(item)"
        >
          <span class="font-mono text-xs text-muted-foreground">{{ item.sku }}</span>
          <strong class="text-sm font-medium">{{ item.name }}</strong>
          <small class="text-xs text-subtle-foreground">{{ item.unitSymbol || '' }}</small>
        </button>
      }
    </div>
  }
</div>
