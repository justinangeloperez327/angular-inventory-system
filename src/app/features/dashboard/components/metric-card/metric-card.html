<article [class]="cardClasses">
  <p class="m-0 text-[0.6875rem] font-semibold uppercase tracking-[0.1em] text-subtle-foreground">
    {{ label }}
  </p>

  <p class="mb-0 mt-2 text-2xl font-semibold tracking-[-0.03em] text-foreground tabular-nums">
    {{ value ?? '—' }}
  </p>

  @if (supportingText) {
    <p class="mb-0 mt-1.5 text-xs leading-4 text-muted-foreground">{{ supportingText }}</p>
  }
</article>
