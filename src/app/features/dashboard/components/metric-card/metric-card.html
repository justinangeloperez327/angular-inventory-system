<article [class]="cardClasses">
  <p class="m-0 text-xs font-medium text-muted-foreground">{{ label }}</p>
  <p class="mb-0 mt-1.5 text-xl font-semibold tracking-tight text-foreground tabular-nums">
    {{ value ?? '—' }}
  </p>
  @if (supportingText) {
    <p class="mb-0 mt-1 text-xs leading-4 text-subtle-foreground">{{ supportingText }}</p>
  }
</article>
