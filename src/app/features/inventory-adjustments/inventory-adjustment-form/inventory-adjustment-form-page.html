<app-content-container>
  @if (loading()) {
    <app-skeleton height="28rem" />
  } @else {
    <app-page-header
      [title]="editing ? 'Edit adjustment' : 'New adjustment'"
      description="Save as draft first. Posting is a separate irreversible inventory action."
    />

    @if (error()) {
      <div class="mt-4">
        <app-alert variant="danger" title="Unable to save adjustment">{{ error() }}</app-alert>
      </div>
    }

    <form class="mt-6 max-w-4xl" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <section>
        <div class="mb-3">
          <h2 class="m-0 text-lg font-semibold text-foreground">Inventory correction</h2>
          <p class="mb-0 mt-1 text-xs leading-5 text-muted-foreground">
            Select the product, warehouse, direction, positive quantity, and controlled reason.
          </p>
        </div>

        <div class="grid gap-3 md:grid-cols-2">
          <app-adjustment-product-lookup
            class="md:col-span-2"
            [selectedLabel]="selectedProductLabel()"
            [error]="fieldError('productId')"
            (selected)="selectProduct($event)"
            (cleared)="clearProduct()"
          />
          <app-select
            label="Warehouse"
            placeholder="Select warehouse"
            [options]="warehouseOptions()"
            formControlName="warehouseId"
            [error]="fieldError('warehouseId')"
          />
          <app-select
            label="Direction"
            [options]="[
              { label: 'Increase stock', value: 'increase' },
              { label: 'Decrease stock', value: 'decrease' }
            ]"
            formControlName="direction"
            [error]="fieldError('direction')"
          />
          <app-input
            type="number"
            label="Quantity"
            [min]="0.000001"
            step="any"
            formControlName="quantity"
            [error]="fieldError('quantity')"
          />
          <app-select
            label="Reason"
            placeholder="Select reason"
            [options]="reasonOptions()"
            formControlName="reasonCode"
            [error]="fieldError('reasonCode')"
          />
          <app-textarea
            class="md:col-span-2"
            label="Notes"
            hint="Explain the business reason and evidence for the correction."
            formControlName="notes"
            [error]="fieldError('notes')"
          />
        </div>
      </section>

      <div class="mt-5 flex items-center justify-end gap-3 border-t border-border pt-4">
        <a
          [routerLink]="id ? ['/adjustments', id] : ['/adjustments']"
          class="text-base font-medium text-muted-foreground no-underline hover:text-foreground"
        >
          Cancel
        </a>
        <app-button type="submit" [loading]="saving()">Save draft</app-button>
      </div>
    </form>
  }
</app-content-container>
