<header class="header">
  <button class="header__menu" type="button" aria-label="Open navigation" (click)="menuRequested.emit()">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <div class="header__context">
    <span class="header__product">Inventory System</span>
  </div>

  <div class="header__actions">
    @if (session.currentUser(); as user) {
      <div class="header__user">
        <strong>{{ user.name }}</strong>
        <span>{{ user.email }}</span>
      </div>
    }

    <button class="header__logout" type="button" [disabled]="loggingOut()" (click)="logout()">
      {{ loggingOut() ? 'Signing out…' : 'Sign out' }}
    </button>
  </div>
</header>
