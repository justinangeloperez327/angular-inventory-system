<header class="sticky top-0 z-10 flex h-header items-center gap-3 border-b border-border bg-surface/95 px-4 backdrop-blur-md md:px-6">
  <button
    #menuButton
    class="grid size-9 place-content-center gap-1 rounded-sm border border-border bg-surface text-foreground shadow-control transition-[background-color,border-color] hover:border-border-strong hover:bg-surface-muted disabled:cursor-not-allowed disabled:opacity-50 lg:hidden"
    type="button"
    aria-label="Open navigation"
    aria-controls="primary-navigation"
    [attr.aria-expanded]="navigationOpen"
    (click)="menuRequested.emit()"
  >
    <span class="block h-px w-4 bg-current"></span>
    <span class="block h-px w-4 bg-current"></span>
    <span class="block h-px w-4 bg-current"></span>
  </button>

  <div class="min-w-0">
    <span class="block text-[0.6875rem] font-semibold uppercase tracking-[0.12em] text-subtle-foreground">
      Workspace
    </span>
    <strong class="block truncate text-sm font-medium tracking-[-0.01em] text-foreground">
      Inventory operations
    </strong>
  </div>

  <div class="ml-auto flex min-w-0 items-center gap-2 sm:gap-3">
    @if (session.currentUser(); as user) {
      <div
        class="grid size-8 shrink-0 place-items-center rounded-full border border-border bg-surface-muted text-xs font-semibold uppercase text-foreground"
        aria-hidden="true"
      >
        {{ user.name.charAt(0) }}
      </div>

      <div class="hidden min-w-0 text-right sm:block">
        <strong class="block max-w-48 truncate text-sm font-medium text-foreground">{{ user.name }}</strong>
        <span class="mt-0.5 block max-w-48 truncate text-xs text-muted-foreground">{{ user.email }}</span>
      </div>
    }

    <span class="hidden h-6 w-px bg-border sm:block" aria-hidden="true"></span>

    <button
      class="min-h-control-sm rounded-sm border border-border bg-surface px-2.5 text-sm font-medium text-foreground shadow-control transition-[background-color,border-color] hover:border-border-strong hover:bg-surface-muted disabled:cursor-not-allowed disabled:opacity-50"
      type="button"
      [disabled]="loggingOut()"
      (click)="logout()"
    >
      {{ loggingOut() ? 'Signing out…' : 'Sign out' }}
    </button>
  </div>
</header>
