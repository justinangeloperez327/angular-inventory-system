<div class="shell">
  <a class="shell__skip-link" href="#main-content">Skip to main content</a>

  <app-sidebar
    [open]="mobileNavigationOpen()"
    (closed)="mobileNavigationOpen.set(false)"
  />

  <div class="shell__workspace">
    <app-header (menuRequested)="mobileNavigationOpen.set(true)" />

    <main id="main-content" class="shell__content" tabindex="-1">
      <router-outlet />
    </main>
  </div>

  <app-toast-outlet />
</div>
