@if (open) {
  <button
    class="fixed inset-0 z-20 border-0 bg-black/35 p-0 lg:hidden"
    type="button"
    tabindex="-1"
    aria-label="Close navigation"
    (click)="closed.emit()"
  ></button>
}

<aside
  id="primary-navigation"
  class="fixed inset-y-0 left-0 z-30 w-sidebar border-r border-border bg-surface transition-transform duration-150 lg:visible lg:translate-x-0"
  [class.invisible]="!open"
  [class.-translate-x-full]="!open"
  [class.visible]="open"
  [class.translate-x-0]="open"
  [attr.role]="open ? 'dialog' : null"
  [attr.aria-modal]="open ? 'true' : null"
  aria-label="Primary navigation"
  [cdkTrapFocus]="open"
  [cdkTrapFocusAutoCapture]="open"
>
  <div class="flex h-header items-center gap-3 border-b border-border px-4">
    <div
      class="grid size-8 place-items-center rounded-sm border border-border-strong bg-foreground text-xs font-semibold tracking-wide text-surface"
      aria-hidden="true"
    >
      IS
    </div>

    <div class="min-w-0">
      <strong class="block truncate text-base font-semibold">Inventory</strong>
      <span class="mt-0.5 block truncate text-xs text-muted-foreground">Management System</span>
    </div>

    <button
      class="ml-auto grid size-8 place-items-center rounded-sm border-0 bg-transparent text-xl text-muted-foreground hover:bg-surface-muted hover:text-foreground lg:hidden"
      type="button"
      aria-label="Close navigation"
      (click)="closed.emit()"
    >
      ×
    </button>
  </div>

  <nav class="h-[calc(100vh-var(--spacing-header))] overflow-y-auto px-3 py-4" aria-label="Application">
    @for (section of sections(); track section.label) {
      <section class="mt-5 first:mt-0">
        <p
          class="mb-1.5 mt-0 px-2 text-xs font-semibold uppercase tracking-wider text-subtle-foreground"
        >
          {{ section.label }}
        </p>

        <div class="grid gap-0.5">
          @for (item of section.items; track item.route) {
            <a
              class="flex min-h-9 items-center gap-2.5 border-l-2 border-transparent px-2.5 py-1.5 text-base font-normal text-muted-foreground no-underline transition-colors hover:bg-surface-muted hover:text-foreground"
              [routerLink]="item.route"
              [routerLinkActive]="[
                'border-primary',
                'bg-surface-strong',
                'font-medium',
                'text-foreground'
              ]"
              [routerLinkActiveOptions]="{ exact: false }"
              ariaCurrentWhenActive="page"
              (click)="closeAfterNavigation()"
            >
              <app-navigation-icon [name]="item.icon" />
              <span class="truncate">{{ item.label }}</span>
            </a>
          }
        </div>
      </section>
    }
  </nav>
</aside>
