@if (open) {
  <button
    class="fixed inset-0 z-20 border-0 bg-black/45 p-0 backdrop-blur-[1px] lg:hidden"
    type="button"
    tabindex="-1"
    aria-label="Close navigation"
    (click)="closed.emit()"
  ></button>
}

<aside
  id="primary-navigation"
  class="fixed inset-y-0 left-0 z-30 flex w-sidebar flex-col border-r border-shell-border bg-shell text-shell-foreground shadow-lg transition-transform duration-150 lg:visible lg:translate-x-0 lg:shadow-none"
  [class.invisible]="!open"
  [class.-translate-x-full]="!open"
  [class.visible]="open"
  [class.translate-x-0]="open"
  [attr.role]="open ? 'dialog' : null"
  [attr.aria-modal]="open ? 'true' : null"
  aria-label="Primary navigation"
  [cdkTrapFocus]="open"
  [cdkTrapFocusAutoCapture]="open"
>
  <div class="flex h-header shrink-0 items-center gap-3 border-b border-shell-border px-4">
    <div
      class="relative grid size-8 place-items-center overflow-hidden rounded-sm bg-primary text-[0.6875rem] font-semibold tracking-[0.08em] text-white shadow-control"
      aria-hidden="true"
    >
      <span class="relative z-10">IS</span>
      <span class="absolute -bottom-3 -right-2 size-6 rotate-45 border border-white/20"></span>
    </div>

    <div class="min-w-0">
      <strong class="block truncate text-sm font-semibold tracking-[-0.01em] text-shell-foreground">
        Inventory
      </strong>
      <span class="mt-0.5 block truncate text-xs text-shell-muted">Operations workspace</span>
    </div>

    <button
      class="ml-auto grid size-8 place-items-center rounded-sm border border-transparent bg-transparent text-xl text-shell-muted transition-colors hover:border-shell-border hover:bg-shell-hover hover:text-shell-foreground lg:hidden"
      type="button"
      aria-label="Close navigation"
      (click)="closed.emit()"
    >
      ×
    </button>
  </div>

  <nav class="min-h-0 flex-1 overflow-y-auto px-3 py-4" aria-label="Application">
    @for (section of sections(); track section.label) {
      <section class="mt-5 first:mt-0">
        <p
          class="mb-1.5 mt-0 px-2.5 text-[0.6875rem] font-semibold uppercase tracking-[0.12em] text-shell-subtle"
        >
          {{ section.label }}
        </p>

        <div class="grid gap-0.5">
          @for (item of section.items; track item.route) {
            <a
              class="group flex min-h-9 items-center gap-2.5 rounded-sm border border-transparent px-2.5 py-1.5 text-sm font-normal text-shell-muted no-underline transition-[background-color,border-color,color] duration-100 hover:border-shell-border hover:bg-shell-hover hover:text-shell-foreground"
              [routerLink]="item.route"
              [routerLinkActive]="[
                'border-shell-border',
                'bg-shell-active',
                'font-medium',
                'text-shell-foreground'
              ]"
              [routerLinkActiveOptions]="{ exact: false }"
              ariaCurrentWhenActive="page"
              (click)="closeAfterNavigation()"
            >
              <span
                class="grid size-6 shrink-0 place-items-center rounded-xs text-current opacity-70 transition-opacity group-hover:opacity-100"
                aria-hidden="true"
              >
                <app-navigation-icon [name]="item.icon" />
              </span>
              <span class="truncate">{{ item.label }}</span>
            </a>
          }
        </div>
      </section>
    }
  </nav>

  <div class="shrink-0 border-t border-shell-border px-4 py-3">
    <div class="flex items-center gap-2 text-xs text-shell-subtle">
      <span class="size-1.5 rounded-full bg-primary" aria-hidden="true"></span>
      <span>Operational workspace</span>
    </div>
  </div>
</aside>
