<button
  [class]="buttonClasses"
  [type]="type"
  [disabled]="disabled || loading"
  [attr.aria-busy]="loading ? 'true' : null"
>
  @if (loading) {
    <span
      class="size-3.5 animate-spin rounded-full border-2 border-current border-r-transparent"
      aria-hidden="true"
    ></span>
  }
  <ng-content />
</button>
