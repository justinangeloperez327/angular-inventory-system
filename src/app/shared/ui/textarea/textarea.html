<label class="grid min-w-0 gap-1.5" [for]="id || fallbackId">
  @if (label) {
    <span class="text-xs font-medium text-muted-foreground">{{ label }}</span>
  }

  <textarea
    class="min-h-24 w-full min-w-0 resize-y rounded-sm border border-border bg-surface px-2.5 py-2 text-base leading-5 text-foreground shadow-control transition-[border-color,box-shadow,background-color] placeholder:text-subtle-foreground focus:border-focus focus:outline-none focus:ring-2 focus:ring-focus/10 disabled:cursor-not-allowed disabled:bg-surface-muted disabled:text-muted-foreground disabled:opacity-75"
    [class.border-danger]="error"
    [id]="id || fallbackId"
    [rows]="rows"
    [placeholder]="placeholder"
    [disabled]="disabled"
    [value]="value"
    [attr.aria-invalid]="error ? 'true' : null"
    [attr.aria-describedby]="error ? (id || fallbackId) + '-error' : hint ? (id || fallbackId) + '-hint' : null"
    (input)="handleInput($event)"
    (blur)="handleBlur()"
  ></textarea>

  @if (error) {
    <span class="text-xs leading-4 text-danger" [id]="(id || fallbackId) + '-error'">{{ error }}</span>
  } @else if (hint) {
    <span class="text-xs leading-4 text-muted-foreground" [id]="(id || fallbackId) + '-hint'">{{ hint }}</span>
  }
</label>
