<label class="grid min-w-0 gap-1.5" [for]="id || fallbackId">
  @if (label) {
    <span class="text-xs font-medium text-muted-foreground">{{ label }}</span>
  }

  <select
    class="min-h-control w-full min-w-0 rounded-sm border border-border bg-surface px-2.5 text-base text-foreground shadow-control transition-[border-color,box-shadow,background-color] focus:border-focus focus:outline-none focus:ring-2 focus:ring-focus/10 disabled:cursor-not-allowed disabled:bg-surface-muted disabled:text-muted-foreground disabled:opacity-75"
    [class.border-danger]="error"
    [id]="id || fallbackId"
    [disabled]="disabled"
    [value]="value"
    [attr.aria-invalid]="error ? 'true' : null"
    [attr.aria-describedby]="error ? (id || fallbackId) + '-error' : hint ? (id || fallbackId) + '-hint' : null"
    (change)="handleChange($event)"
    (blur)="handleBlur()"
  >
    <option value="">{{ placeholder }}</option>
    @for (option of options; track option.value) {
      <option [value]="option.value" [disabled]="option.disabled">{{ option.label }}</option>
    }
  </select>

  @if (error) {
    <span class="text-xs leading-4 text-danger" [id]="(id || fallbackId) + '-error'">{{ error }}</span>
  } @else if (hint) {
    <span class="text-xs leading-4 text-muted-foreground" [id]="(id || fallbackId) + '-hint'">{{ hint }}</span>
  }
</label>
