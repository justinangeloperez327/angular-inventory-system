<app-dialog
  [open]="open"
  [title]="title"
  [description]="message"
  (closed)="cancelled.emit()"
>
  <div class="flex justify-end gap-2">
    <app-button variant="secondary" (click)="cancelled.emit()">Cancel</app-button>
    <app-button [variant]="destructive ? 'danger' : 'primary'" (click)="confirmed.emit()">
      {{ confirmLabel }}
    </app-button>
  </div>
</app-dialog>
