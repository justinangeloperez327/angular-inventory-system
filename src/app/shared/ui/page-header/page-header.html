<header class="flex flex-col gap-3 sm:flex-row sm:items-start sm:justify-between">
  <div class="min-w-0">
    <h1 class="m-0 text-2xl font-semibold leading-tight text-foreground">{{ title }}</h1>
    @if (description) {
      <p class="mt-1.5 mb-0 max-w-3xl text-base leading-5 text-muted-foreground">
        {{ description }}
      </p>
    }
  </div>

  <div class="flex shrink-0 flex-wrap items-center gap-2">
    <ng-content select="[actions]" />
  </div>
</header>
