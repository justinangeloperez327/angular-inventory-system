<nav
  class="flex items-center justify-end gap-2 text-sm text-muted-foreground"
  aria-label="Pagination"
>
  <button
    class="min-h-control-sm rounded-sm border border-border bg-surface px-2.5 font-medium text-foreground transition-colors hover:bg-surface-muted disabled:cursor-not-allowed disabled:opacity-40"
    type="button"
    [disabled]="page <= 1"
    (click)="goTo(page - 1)"
  >
    Previous
  </button>

  <span class="min-w-20 text-center tabular-nums">Page {{ page }} of {{ totalPages }}</span>

  <button
    class="min-h-control-sm rounded-sm border border-border bg-surface px-2.5 font-medium text-foreground transition-colors hover:bg-surface-muted disabled:cursor-not-allowed disabled:opacity-40"
    type="button"
    [disabled]="page >= totalPages"
    (click)="goTo(page + 1)"
  >
    Next
  </button>
</nav>
