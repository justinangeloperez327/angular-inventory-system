<nav
  class="flex items-center justify-end gap-1.5 text-xs text-muted-foreground"
  aria-label="Pagination"
>
  <button
    class="grid size-8 place-items-center rounded-sm border border-border bg-surface text-base font-medium text-foreground shadow-control transition-[background-color,border-color] hover:border-border-strong hover:bg-surface-muted disabled:cursor-not-allowed disabled:opacity-35"
    type="button"
    aria-label="Previous page"
    [disabled]="page <= 1"
    (click)="goTo(page - 1)"
  >
    ‹
  </button>

  <span class="min-w-20 px-1 text-center tabular-nums">
    {{ page }} / {{ totalPages }}
  </span>

  <button
    class="grid size-8 place-items-center rounded-sm border border-border bg-surface text-base font-medium text-foreground shadow-control transition-[background-color,border-color] hover:border-border-strong hover:bg-surface-muted disabled:cursor-not-allowed disabled:opacity-35"
    type="button"
    aria-label="Next page"
    [disabled]="page >= totalPages"
    (click)="goTo(page + 1)"
  >
    ›
  </button>
</nav>
