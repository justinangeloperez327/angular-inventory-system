<label class="grid min-w-0 gap-1.5" [for]="id || fallbackId">
  @if (label) {
    <span class="text-sm font-semibold text-foreground">{{ label }}</span>
  }

  <input
    class="min-h-control w-full min-w-0 rounded-sm border border-border bg-surface px-2.5 text-base text-foreground transition-colors placeholder:text-subtle-foreground focus:border-focus disabled:cursor-not-allowed disabled:bg-surface-muted disabled:text-muted-foreground disabled:opacity-75"
    [class.border-danger]="error"
    [id]="id || fallbackId"
    [type]="type"
    [placeholder]="placeholder"
    [attr.autocomplete]="autocomplete || null"
    [attr.min]="min"
    [attr.max]="max"
    [attr.step]="step"
    [disabled]="disabled"
    [value]="value"
    [attr.aria-invalid]="error ? 'true' : null"
    [attr.aria-describedby]="error ? (id || fallbackId) + '-error' : hint ? (id || fallbackId) + '-hint' : null"
    (input)="handleInput($event)"
    (blur)="handleBlur()"
  />

  @if (error) {
    <span class="text-xs leading-4 text-danger" [id]="(id || fallbackId) + '-error'">{{ error }}</span>
  } @else if (hint) {
    <span class="text-xs leading-4 text-muted-foreground" [id]="(id || fallbackId) + '-hint'">{{ hint }}</span>
  }
</label>
