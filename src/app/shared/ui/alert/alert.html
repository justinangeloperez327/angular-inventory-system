<div
  [class]="alertClasses"
  [attr.role]="variant === 'danger' ? 'alert' : 'status'"
  [attr.aria-live]="variant === 'danger' ? 'assertive' : 'polite'"
>
  @if (title) {
    <strong class="mb-1 block text-sm font-semibold text-foreground">{{ title }}</strong>
  }
  <div class="text-base leading-5 text-muted-foreground"><ng-content /></div>
</div>
