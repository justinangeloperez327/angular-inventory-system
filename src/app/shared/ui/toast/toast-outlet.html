<section
  class="fixed bottom-4 right-4 z-[100] grid w-[min(22rem,calc(100vw-2rem))] gap-2"
  aria-label="Notifications"
>
  @for (toast of toastService.messages(); track toast.id) {
    <div
      class="flex items-start gap-3 border border-border border-l-[3px] bg-surface p-3 text-sm shadow-md"
      [class.border-l-primary]="toast.variant === 'info'"
      [class.border-l-success]="toast.variant === 'success'"
      [class.border-l-warning]="toast.variant === 'warning'"
      [class.border-l-danger]="toast.variant === 'danger'"
      [attr.role]="toast.variant === 'danger' ? 'alert' : 'status'"
      [attr.aria-live]="toast.variant === 'danger' ? 'assertive' : 'polite'"
    >
      <span class="min-w-0 flex-1 leading-5 text-foreground">{{ toast.message }}</span>
      <button
        class="grid size-6 shrink-0 place-items-center rounded-sm border-0 bg-transparent text-base text-muted-foreground transition-colors hover:bg-surface-muted hover:text-foreground"
        type="button"
        aria-label="Dismiss notification"
        (click)="toastService.dismiss(toast.id)"
      >
        ×
      </button>
    </div>
  }
</section>
