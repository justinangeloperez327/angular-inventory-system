@if (open) {
  <div class="dialog-backdrop" (click)="onBackdrop($event)">
    <section class="dialog" role="dialog" aria-modal="true" [attr.aria-label]="title">
      <div class="dialog__header">
        <div>
          <h2>{{ title }}</h2>
          @if (description) {
            <p>{{ description }}</p>
          }
        </div>
        <button type="button" aria-label="Close dialog" (click)="closed.emit()">×</button>
      </div>
      <div class="dialog__body"><ng-content /></div>
    </section>
  </div>
}
